<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Körük Kontrol">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f7">
<title>Körük Kontrol</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7 7h3v3H7zM14 7h3v3h-3zM7 14h3v3H7zM14 14h1.5v1.5H14zM15.5 15.5H17V17h-1.5z"/></svg>
      <span>Körük Kontrol</span>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Menü"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>

  <!-- Ana ekran: aktif yükleme yok -->
  <main id="homeView" class="view">
    <section class="hero">
      <div class="hero-icon"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></div>
      <h1>Yeni yükleme</h1>
      <p>Kamyonun checklist PDF'ini yükle. Kontrol o uçuş için başlar.</p>
      <label class="btn primary lg" for="pdfIn">Checklist yükle</label>
    </section>
    <ol class="steps">
      <li><b>1</b><span>Checklist PDF'ini yükle</span></li>
      <li><b>2</b><span>Etiketlerin kare kodunu okut</span></li>
      <li><b>3</b><span>Eksik kalmayınca yüklemeyi tamamla</span></li>
    </ol>
    <section id="recent"></section>
  </main>

  <!-- Yükleme ekranı -->
  <main id="loadView" class="view hide">
    <section class="flight">
      <div class="flight-row">
        <div>
          <div class="flight-no" id="fNo"></div>
          <div class="flight-meta" id="fMeta"></div>
        </div>
        <div class="ring" id="ring"><svg viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15.5"/><circle class="fg" id="ringFg" cx="18" cy="18" r="15.5"/></svg><div class="ring-txt"><b id="pDone">0</b><span id="pTotal">/0</span></div></div>
      </div>
      <div class="notices" id="notices"></div>
    </section>

    <section class="feedback idle" id="fb">
      <div class="fb-icon" id="fbIcon"></div>
      <div class="fb-body"><div class="fb-title" id="fbTitle">Etiketleri okut</div><div class="fb-sub" id="fbSub">Kare kodu kameraya göster</div></div>
    </section>

    <button class="btn primary xl" id="scanBtn"><svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M7 12h10"/></svg>Etiket okut</button>

    <div class="list-head">
      <div class="seg" id="seg"><button data-v="missing" class="on">Eksikler <span id="cMiss"></span></button><button data-v="all">Tüm liste</button></div>
    </div>
    <section id="items"></section>
  </main>

  <!-- Tamamlanan yüklemeler -->
  <main id="histView" class="view hide">
    <div class="sub-head"><button class="link back" id="histBack">‹ Geri</button><h2>Tamamlanan yüklemeler</h2></div>
    <section id="histList"></section>
  </main>
</div>

<div class="bottom" id="bottom"><button class="btn success lg" id="finishBtn">Yüklemeyi tamamla</button></div>

<!-- Canlı tarama -->
<div id="live" class="live hide">
  <video id="video" playsinline muted autoplay></video>
  <div class="live-top">
    <div><div class="live-flight" id="lvFlight"></div><div class="live-count" id="lvCount"></div></div>
    <button class="round" id="liveClose" aria-label="Kapat"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="frame" id="frame"><i></i><i></i><i></i><i></i></div>
  <div class="live-msg" id="lvMsg"></div>
  <div class="live-bottom">
    <button class="pill hide" id="torchBtn">Fener</button>
    <button class="pill" id="livePhoto">Fotoğrafla oku</button>
  </div>
  <div class="alarm hide" id="alarm">
    <svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></svg>
    <div class="alarm-title" id="alarmTitle"></div>
    <div class="alarm-sub" id="alarmSub"></div>
    <button class="btn light lg" id="alarmOk">Gördüm, devam</button>
  </div>
</div>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog"></div></div>
<div class="toast" id="toast"></div>

<input type="file" id="pdfIn" accept="application/pdf,.pdf" class="hide">
<input type="file" id="photoIn" accept="image/*" capture="environment" class="hide">

<script src="vendor/pdf.min.js"></script>
<script src="vendor/zxing-reader.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
